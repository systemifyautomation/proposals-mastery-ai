<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f0f0f0;
    }
    canvas {
      margin: 10px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Extension Icon Generator</h1>
  <p>Click the buttons to download each icon size:</p>
  
  <canvas id="canvas16" width="16" height="16"></canvas>
  <button onclick="downloadIcon(16)">Download 16x16</button>
  <br>
  
  <canvas id="canvas48" width="48" height="48"></canvas>
  <button onclick="downloadIcon(48)">Download 48x48</button>
  <br>
  
  <canvas id="canvas128" width="128" height="128"></canvas>
  <button onclick="downloadIcon(128)">Download 128x128</button>

  <script>
    function drawIcon(size) {
      const canvas = document.getElementById(`canvas${size}`);
      const ctx = canvas.getContext('2d');
      
      // Background - green circle
      ctx.fillStyle = '#14a800';
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      ctx.fill();
      
      // Letter "P" in white
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.6}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('P', size / 2, size / 2);
    }
    
    function downloadIcon(size) {
      const canvas = document.getElementById(`canvas${size}`);
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL();
      link.click();
    }
    
    // Draw all icons on load
    [16, 48, 128].forEach(drawIcon);
  </script>
</body>
</html>
