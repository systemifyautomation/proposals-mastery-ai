<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposals Mastery AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f9f9f9;
    }

    .header {
      background-color: #001e00;
      color: white;
      padding: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      margin-bottom: 4px;
      color: #14a800;
    }

    .header p {
      font-size: 12px;
      color: #d4d4d4;
    }

    .content {
      padding: 16px;
    }

    .section {
      background-color: white;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #e0e0e0;
    }

    .section h2 {
      font-size: 14px;
      font-weight: 600;
      color: #001e00;
      margin-bottom: 8px;
    }

    .job-info {
      font-size: 12px;
      color: #6e6e6e;
      margin-bottom: 8px;
    }

    .job-info strong {
      color: #1f1f1f;
      display: block;
      margin-bottom: 4px;
    }

    .template-select {
      width: 100%;
      padding: 8px;
      border: 2px solid #d4d4d4;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      background-color: white;
    }

    .template-select:focus {
      outline: none;
      border-color: #14a800;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background-color: #14a800;
      color: white;
    }

    .btn-primary:hover {
      background-color: #108a00;
    }

    .btn-primary:disabled {
      background-color: #d4d4d4;
      cursor: not-allowed;
    }

    .generated-letter {
      background-color: #f5f5f5;
      border: 1px solid #d4d4d4;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.6;
      color: #1f1f1f;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    .btn-secondary {
      background-color: #e0e0e0;
      color: #1f1f1f;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background-color: #d4d4d4;
    }

    .no-job {
      text-align: center;
      padding: 32px 16px;
      color: #6e6e6e;
    }

    .no-job svg {
      margin: 0 auto 12px;
      opacity: 0.5;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #6e6e6e;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Proposals Mastery AI</h1>
    <p>Generate winning cover letters for Upwork</p>
  </div>

  <div class="content">
    <div id="loading" class="loading" style="display: none;">
      <p>Loading...</p>
    </div>

    <div id="no-job" class="no-job" style="display: none;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
      </svg>
      <p>Navigate to an Upwork job posting to analyze it.</p>
    </div>

    <div id="job-details" style="display: none;">
      <div class="section">
        <h2>Job Details</h2>
        <div class="job-info">
          <strong>Title:</strong>
          <span id="job-title">-</span>
        </div>
        <div class="job-info">
          <strong>Description Preview:</strong>
          <span id="job-description">-</span>
        </div>
      </div>

      <div class="section">
        <h2>Select Template</h2>
        <select id="template-select" class="template-select">
          <option value="">Choose a template...</option>
        </select>
        <button id="generate-btn" class="btn btn-primary" disabled>
          Generate Cover Letter
        </button>
      </div>

      <div id="result-section" style="display: none;">
        <div class="section">
          <h2>Generated Cover Letter</h2>
          <div id="generated-letter" class="generated-letter"></div>
          <button id="copy-btn" class="btn btn-secondary">
            Copy to Clipboard
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
